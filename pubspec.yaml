name: image_to_pdf_a4
description: "تطبيق تحويل الصور إلى ملفات PDF بمقاس A4 وبأعلى جودة طباعة"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 📄 إنشاء وتشكيل مستندات الـ PDF
  pdf: ^3.11.1

  # 🖨️ المعاينة والطباعة المباشرة وحفظ الملفات
  printing: ^5.13.2

  # 🖼️ اختيار الصور من الاستوديو أو الكاميرا
  image_picker: ^1.1.2

  # 📁 اختيار الصور أو الملفات من جهاز المستخدم
  file_picker: ^8.1.2

  # 📂 الوصول لإدارة مسارات التخزين في الجهاز
  path_provider: ^2.1.4

  # 🔒 إدارة صلاحيات الوصول للصور والتخزين
  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
