name: lan_phone
description: "تطبيق مراسلة ومكالمات صوتية ومرئية عبر شبكة الواي فاي المحلية فقط."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ============================================
  # === إدارة الحالة ===
  # ============================================
  provider: ^6.1.2

  # ============================================
  # === الشبكة المحلية ===
  # ============================================
  web_socket_channel: ^3.0.1
  multicast_dns: ^0.3.2+7

  # ============================================
  # === WebRTC ===
  # ============================================
  flutter_webrtc: ^0.11.7

  # ============================================
  # === قاعدة البيانات ===
  # ============================================
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # ============================================
  # === التشفير ===
  # ============================================
  crypto: ^3.0.5
  encrypt: ^5.0.3
  pointycastle: ^3.9.1

  # ============================================
  # === الأذونات ===
  # ============================================
  permission_handler: ^11.3.1

  # ============================================
  # === التخزين المحلي ===
  # ============================================
  shared_preferences: ^2.3.2

  # ============================================
  # === الوسائط ===
  # ============================================
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # ============================================
  # === الإشعارات ===
  # ============================================
  flutter_local_notifications: ^17.2.3

  # ============================================
  # === الصوت ===
  # ============================================
  audio_session: ^0.1.21
  flutter_ringtone_player: ^4.0.0+3

  # ============================================
  # === أدوات ===
  # ============================================
  uuid: ^4.5.1
  device_info_plus: ^11.1.0
  intl: ^0.20.3

  # ============================================
  # === QR ===
  # ============================================
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/icons/
