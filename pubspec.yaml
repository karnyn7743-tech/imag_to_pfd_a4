Name: lan_phone
description: "تطبيق مراسلة ومكالمات صوتية ومرئية عبر شبكة الواي فاي المحلية فقط، بدون إنترنت أو شبكات اتصالات."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # ============================================
  # === دعم التوطين (العربية) ===
  # ============================================
  flutter_localizations:
    sdk: flutter

  # ============================================
  # === الواجهة (UI) ===
  # ============================================
  cupertino_icons: ^1.0.8

  # ============================================
  # === إدارة الحالة (State Management) ===
  # ============================================
  provider: ^6.1.2

  # ============================================
  # === الشبكة المحلية (LAN) ===
  # ============================================
  web_socket_channel: ^3.0.1
  # تم تحديث الحزمة إلى أحدث إصدار مستقر يتوافق مع v2 embedding
  multicast_dns: ^0.3.7

  # ============================================
  # === WebRTC (المكالمات الصوتية والفيديو) ===
  # ============================================
  flutter_webrtc: ^0.11.7

  # ============================================
  # === قاعدة البيانات المحلية ===
  # ============================================
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # ============================================
  # === التشفير والأمان ===
  # ============================================
  crypto: ^3.0.5
  encrypt: ^5.0.3
  pointycastle: ^3.9.1

  # ============================================
  # === الأذونات (Permissions) ===
  # ============================================
  permission_handler: ^11.3.1

  # ============================================
  # === التخزين المحلي للتفضيلات ===
  # ============================================
  shared_preferences: ^2.3.2

  # ============================================
  # === الوسائط والملفات ===
  # ============================================
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # ============================================
  # === الإشعارات ===
  # ============================================
  flutter_local_notifications: ^17.2.3

  # ============================================
  # === الصوت ===
  # ============================================
  audio_session: ^0.1.21
  # تم التحديث إلى أحدث إصدار مستقر متوافق
  flutter_ringtone_player: ^4.0.1

  # ============================================
  # === أدوات مساعدة ===
  # ============================================
  uuid: ^4.5.1
  device_info_plus: ^11.1.0
  intl: ^0.20.3

  # ============================================
  # === QR للاقتران بين الأجهزة ===
  # ============================================
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/icons/
