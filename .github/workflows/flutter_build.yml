name: Build LanPhone APK

on:
  push:
    branches: [ main, master, android ]
  pull_request:
    branches: [ main, master, android ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
          cache: true

      - name: Verify Flutter
        run: flutter doctor -v

      # ✅ حذف ملف القفل لضمان تحديث المكتبات
      - name: Remove lock file
        run: rm -f pubspec.lock

      - name: Clean project
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      # ✅ ترقية كل المكتبات إلى أحدث إصداراتها
      - name: Upgrade dependencies
        run: flutter pub upgrade

      - name: Try major upgrade
        run: flutter pub upgrade --major-versions || echo "Major upgrade skipped"

      - name: Analyze code
        run: flutter analyze || true

      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --no-shrink \
            --target-platform android-arm,android-arm64,android-x64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lanphone-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
