name: Build LanPhone APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      # ✅ تحديث إلى v5
      - name: Checkout code
        uses: actions/checkout@v5

      # ✅ تحديث إلى v5
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # تثبيت Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
          cache: true

      # التحقق من Flutter
      - name: Verify Flutter
        run: flutter doctor -v

      # حذف pubspec.lock لضمان تحديث المكتبات
      - name: Remove lock file
        run: rm -f pubspec.lock

      # تنظيف المشروع
      - name: Clean project
        run: flutter clean

      # تنزيل الحزم
      - name: Get dependencies
        run: flutter pub get

      # التحليل (يستمر حتى مع التحذيرات)
      - name: Analyze code
        run: flutter analyze || true

      # بناء APK
      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --no-shrink \
            --target-platform android-arm,android-arm64,android-x64

      # رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lanphone-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
