name: Flutter Build APK

# الأحداث التي تفعل التشغيل التلقائي واليدوي
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً بنقرة زر من تبويب Actions في GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. جلب كود المشروع من غيتهاب
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. إعداد بيئة جافا JDK 17
    - name: Set up Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle' # تفعيل التخزين المؤقت لأدوات Gradle لتسريع البناء

    # 3. إعداد وتسريع بيئة Flutter
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true # تفعيل التخزين المؤقت لمكتبات وأدوات Flutter

    # 4. تحميل واستيراد مكتبات المشروع
    - name: Install Dependencies
      run: flutter pub get

    # 5. بناء تطبيق أندرويد النهائي (APK)
    - name: Build APK
      run: flutter build apk --release

    # 6. رفع ملف الـ APK الناتج ليكون جاهزاً للتحميل
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        retention-days: 7 # الاحتفاظ بالملف للتحميل لمدة 7 أيام بدلاً من استهلاك المساحة للأبد
