# ============================================================
# === إعدادات Gradle العامة ===
# ============================================================

# ذاكرة JVM المخصصة لعملية Gradle
# Xmx8G = 8 جيجابايت للـ heap (مهم لبناء WebRTC)
# MaxMetaspaceSize = 4 جيجابايت للـ metaspace
# ReservedCodeCacheSize = 512 ميجابايت لكاش الكود
# HeapDumpOnOutOfMemoryError = إنشاء ملف تشخيصي عند نفاد الذاكرة
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# ============================================================
# === إعدادات AndroidX و Jetifier ===
# ============================================================

# استخدام مكتبات AndroidX بدلاً من Support Library القديمة
android.useAndroidX=true

# تحويل المكتبات القديمة (Support) تلقائيًا إلى AndroidX
# مفيد للمكتبات التي لم يتم تحديثها بعد
android.enableJetifier=true

# ============================================================
# === إعدادات الأداء والبناء ===
# ============================================================

# عدم إنشاء R class لكل مكتبة على حدة (يسرّع البناء ويقلل الحجم)
android.nonTransitiveRClass=true

# تفعيل بناء Gradle المتوازي (يسرّع البناء متعدد النوى)
org.gradle.parallel=true

# تفعيل التخزين المؤقت للبناء (cache) لتسريع البناء التالي
org.gradle.caching=true

# تفعيل Gradle Daemon (يبقي عملية Gradle جاهزة بين البناءات)
org.gradle.daemon=true

# ============================================================
# === إعدادات Kotlin ===
# ============================================================

# زيادة ذاكرة Kotlin compiler
kotlin.daemon.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
